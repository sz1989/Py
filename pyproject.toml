[project]
name = "py-ai-experiments"
version = "0.1.0"
description = "Python scripts for experimenting with AI agents, web APIs, and financial data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.18.1",
    "google-generativeai>=0.8.6",
    "langchain-core>=1.5.5",
    "langchain-google-genai>=4.3.4",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "uvicorn>=0.52.3",
    "yfinance>=1.6.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pylint>=4.0.7",
]
